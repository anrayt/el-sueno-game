<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EL SUEÑO — Capítulo I: La Ciudad Vacía</title>
<style>
:root{
  --ink:#0a0908; --ash:#8f8a80; --bone:#cfc6b4; --rust:#8a3a22; --blood:#5e1a12; --amber:#b89a52; --dim:#4a463f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;position:fixed;inset:0;touch-action:none;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--serif);color:var(--bone)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto;background:#000}
.layer{position:absolute;inset:0;pointer-events:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* ---------- HUD ---------- */
#hud{padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));transition:opacity .6s}
#estado{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;opacity:.8}
#estado svg{width:38px;height:22px;overflow:visible}
#estado .lid{transition:d .8s, transform .8s}
#estadoTxt{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ash);text-shadow:0 1px 2px #000}
#hudBtns{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.hb{width:38px;height:38px;border:1px solid rgba(143,138,128,.28);background:rgba(8,7,6,.45);display:grid;place-items:center;opacity:.7}
.hb:hover,.hb:active{opacity:1;border-color:var(--amber)}
.hb svg{width:19px;height:19px;stroke:var(--bone);fill:none;stroke-width:1.4}
#zona{position:absolute;left:0;right:0;top:19%;text-align:center;font-size:clamp(20px,3.6vw,38px);letter-spacing:.5em;text-indent:.5em;
  text-transform:uppercase;color:var(--bone);opacity:0;transition:opacity 1.6s;text-shadow:0 0 18px #000,0 2px 3px #000}
#zona small{display:block;font-size:.36em;letter-spacing:.6em;color:var(--rust);margin-bottom:.9em}
#prompt{position:absolute;left:50%;bottom:calc(17% + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  padding:6px 14px;border-top:1px solid rgba(184,154,82,.5);border-bottom:1px solid rgba(184,154,82,.5);background:rgba(6,5,4,.55);opacity:0;transition:opacity .25s;white-space:nowrap}
#prompt b{color:var(--amber);font-weight:normal;margin-right:.7em}
#toast{position:absolute;right:max(14px,env(safe-area-inset-right));top:62px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.toast{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);background:rgba(6,5,4,.6);border-right:2px solid var(--rust);padding:5px 10px;animation:tin 4.2s forwards}
.toast i{color:var(--amber);font-style:normal}
@keyframes tin{0%{opacity:0;transform:translateX(14px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}

/* ---------- subtítulos / diálogo ---------- */
#sub{position:absolute;left:50%;bottom:calc(4.5% + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,92vw);pointer-events:auto;
  background:linear-gradient(rgba(6,5,4,.86),rgba(6,5,4,.93));border:1px solid rgba(143,138,128,.25);border-left:2px solid var(--rust);padding:13px 18px 15px;min-height:74px}
#subWho{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--rust);margin-bottom:5px;min-height:13px}
#subTxt{font-size:clamp(16px,2.3vw,20px);line-height:1.5;color:var(--bone)}
#subTxt.voz{font-style:italic;color:#b9c0bd}
#subTxt.pienso{color:#a8a297}
#subNext{position:absolute;right:12px;bottom:6px;color:var(--amber);font-size:12px;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.15}}
#choices{position:absolute;left:50%;bottom:calc(4.5% + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,92vw);pointer-events:auto;display:flex;flex-direction:column;gap:5px}
#choices .q{font-size:13px;letter-spacing:.14em;color:var(--ash);margin-bottom:4px;text-shadow:0 1px 2px #000}
.ch{text-align:left;font-size:clamp(15px,2.1vw,18px);padding:9px 14px;background:rgba(6,5,4,.88);border:1px solid rgba(143,138,128,.22);border-left:2px solid var(--dim)}
.ch.sel,.ch:hover{border-left-color:var(--amber);color:#fff;background:rgba(30,20,12,.92)}
.ch span.n{color:var(--rust);margin-right:.8em;font-size:.8em}
.w{border-bottom:1px dotted rgba(184,154,82,.55);cursor:help;pointer-events:auto}
.w.new{border-bottom-color:var(--amber);color:#efe6cf}
#tip{position:absolute;max-width:290px;background:#14110d;border:1px solid var(--amber);padding:9px 12px;font-size:14px;line-height:1.4;z-index:60;pointer-events:none;box-shadow:0 6px 24px #000}
#tip b{display:block;color:var(--amber);font-weight:normal;letter-spacing:.12em;margin-bottom:3px}
#tip em{display:block;color:var(--ash);margin-top:5px}

/* ---------- paneles ---------- */
.veil{position:absolute;inset:0;background:rgba(3,3,3,.82);display:grid;place-items:center;pointer-events:auto;z-index:20;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.panel{width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;background:#0c0b09;border:1px solid #2c2822;
  box-shadow:0 0 0 1px #000,0 0 80px #000, inset 0 0 90px rgba(0,0,0,.8);position:relative}
.panel::before{content:"";position:absolute;inset:5px;border:1px solid rgba(138,58,34,.25);pointer-events:none}
.tabs{display:flex;border-bottom:1px solid #2c2822;flex-wrap:wrap;padding-right:46px}
.tab{flex:1;padding:13px 4px 11px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;min-width:84px}
.tab.on{color:var(--bone);border-bottom-color:var(--rust)}
.pbody{padding:18px 20px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:300px;flex:1}
.close{position:absolute;right:10px;top:8px;font-size:20px;color:var(--ash);z-index:3;width:34px;height:34px}
.pfoot{padding:8px 20px 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);border-top:1px solid #1d1a16}
h3{font-weight:normal;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);margin:0 0 10px}
.empty{color:var(--dim);font-style:italic;padding:20px 0}
/* inventario */
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
@media(max-width:560px){.slots{grid-template-columns:repeat(3,1fr)}}
.slot{aspect-ratio:1;border:1px solid #2c2822;background:radial-gradient(#191612,#0a0908);display:grid;place-items:center;position:relative}
.slot.full{cursor:pointer}.slot.sel{border-color:var(--amber);box-shadow:inset 0 0 18px rgba(184,154,82,.25)}
.slot.comb{border-color:var(--rust);box-shadow:inset 0 0 18px rgba(138,58,34,.5)}
.slot svg{width:58%;height:58%;stroke:var(--bone);fill:none;stroke-width:1.3}
.slot small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idesc{min-height:92px;border-top:1px solid #1d1a16;padding-top:12px}
.idesc h4{margin:0 0 6px;font-weight:normal;font-size:19px;color:#e8dfca}
.idesc p{margin:0 0 12px;line-height:1.5;color:#b5ad9c}
.btn{display:inline-block;border:1px solid #3a342c;padding:8px 16px;margin:0 8px 6px 0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone);background:#12100d}
.btn:hover,.btn:active{border-color:var(--amber);color:#fff}
.btn.wide{display:block;width:100%;margin:0 0 8px;padding:13px;text-align:center}
/* cuaderno */
.two{display:grid;grid-template-columns:230px 1fr;gap:18px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.list button{display:block;width:100%;text-align:left;padding:7px 9px;font-size:15px;color:var(--ash);border-left:2px solid transparent}
.list button.on{color:#fff;border-left-color:var(--rust);background:#14110d}
.list .cat{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);margin:12px 0 4px 9px}
.paper{background:linear-gradient(170deg,#cdbf9f,#b3a27e 70%,#9c8a67);color:#231c12;padding:22px 24px;line-height:1.65;font-size:17px;white-space:pre-line;
  box-shadow:inset 0 0 50px rgba(60,40,10,.55),0 4px 22px #000;position:relative;transform:rotate(-.25deg)}
.paper.news{font-family:Georgia,"Times New Roman",serif;background:linear-gradient(170deg,#c9c5b8,#a9a595 80%)}
.paper.wall{background:#1a1816;color:#b93a22;font-family:Impact,"Arial Narrow Bold","Helvetica Neue",sans-serif;font-size:30px;letter-spacing:.08em;text-align:center;box-shadow:inset 0 0 60px #000}
.paper.med{font-family:"Courier New",Courier,monospace;font-size:15px;background:linear-gradient(170deg,#d8d6cc,#bdbbb0)}
.paper.metal{background:linear-gradient(170deg,#3a352c,#211e19);color:#c9b98a;text-align:center;letter-spacing:.2em;box-shadow:inset 0 0 40px #000}
.paper .w{border-bottom-color:rgba(60,30,10,.6)}.paper.wall .w,.paper.metal .w{border-bottom-color:rgba(200,160,90,.4)}
.paper h5{margin:0 0 10px;font-size:1.25em;font-weight:bold;letter-spacing:.04em;border-bottom:2px solid #231c12;padding-bottom:6px;text-transform:uppercase}
.tag{display:inline-block;font-size:10px;letter-spacing:.24em;border:1px solid var(--dim);color:var(--ash);padding:2px 7px;margin-bottom:10px;text-transform:uppercase}
.tag.h{border-color:#5a6b4a;color:#9cb184}.tag.t{border-color:#7a6a3a;color:var(--amber)}.tag.i{border-color:var(--rust);color:#c9694c}
.arch p{line-height:1.6;color:#bdb5a3;margin:0 0 10px;font-size:16px}
/* diccionario */
.dic{columns:2;column-gap:26px}@media(max-width:640px){.dic{columns:1}}
.dw{break-inside:avoid;margin:0 0 13px;padding-left:10px;border-left:1px solid #2c2822}
.dw b{font-weight:normal;color:#e8dfca;font-size:17px}.dw p{margin:2px 0;color:#a39c8c;font-size:14px;line-height:1.4}.dw em{color:var(--amber);font-size:14px}
.count{float:right;color:var(--dim);font-size:11px;letter-spacing:.2em}
/* documento a pantalla */
#doc .panel{width:min(620px,100%);background:none;border:0;box-shadow:none}#doc .panel::before{display:none}
#doc .hint{text-align:center;margin-top:14px;font-size:11px;letter-spacing:.3em;color:var(--ash);text-transform:uppercase}
#docBody{overflow-y:auto;max-height:78vh;padding:6px;touch-action:pan-y}
/* pausa */
#pause .panel{width:min(400px,100%);padding:26px 26px 18px;overflow-y:auto;touch-action:pan-y;display:block}
#gira{display:none;color:#8a3a22}
@media(orientation:portrait) and (max-width:700px){#gira{display:block}}
@media(max-height:480px){#pause .panel{padding:14px 20px 10px}#pause h2{margin-bottom:10px;font-size:17px}#pause .btn.wide{padding:8px;margin-bottom:5px}#title h1{font-size:44px}#title .cap{margin:6px 0 16px}#title .btn.wide{padding:9px;margin-bottom:6px}#title .note{margin-top:8px;line-height:1.5}}
#pause h2,#title h1{font-weight:normal;text-align:center;margin:0}
#pause h2{letter-spacing:.5em;text-indent:.5em;font-size:22px;margin-bottom:20px;color:var(--bone)}
.vol{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.vol input{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:#3a342c;outline:none;touch-action:pan-x}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:var(--rust);border:1px solid #000;cursor:pointer}
.vol input::-moz-range-thumb{width:14px;height:22px;background:var(--rust);border:1px solid #000;border-radius:0}
.keys{font-size:12px;color:var(--dim);line-height:1.9;letter-spacing:.06em;margin-top:8px;border-top:1px solid #1d1a16;padding-top:10px}
.keys b{color:var(--ash);font-weight:normal;border:1px solid #3a342c;padding:0 5px;margin-right:4px;font-size:11px}
/* enigma */
#puzzle .panel{width:min(560px,100%);padding:24px;text-align:center;background:radial-gradient(#1b1814,#090807)}
#plates{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.plate{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a443a,#1e1b17 70%);border:2px solid #0a0908;box-shadow:0 5px 0 #050404,inset 0 0 20px #000;display:grid;place-items:center;transition:transform .12s, box-shadow .12s}
.plate svg{width:56%;height:56%;stroke:#9a9078;fill:none;stroke-width:2.2;stroke-linecap:round}
.plate.down{transform:translateY(4px);box-shadow:0 1px 0 #050404,inset 0 0 26px rgba(138,58,34,.9)}.plate.down svg{stroke:#d9562f}
#pzSeq{height:16px;letter-spacing:.8em;color:var(--rust)}
#pzMsg{min-height:44px;color:var(--ash);font-style:italic;line-height:1.4}
/* título / final */
#title{background:#000;z-index:40;pointer-events:auto;display:grid;place-items:center;text-align:center}
#title .in{width:min(440px,88vw)}
#title h1{font-size:clamp(44px,10vw,92px);letter-spacing:.34em;text-indent:.34em;color:#d8cfbb;text-shadow:0 0 40px rgba(138,58,34,.55);animation:breathe 7s infinite}
@keyframes breathe{50%{text-shadow:0 0 70px rgba(138,58,34,.9);letter-spacing:.37em}}
#title .cap{letter-spacing:.42em;text-indent:.42em;font-size:13px;color:var(--rust);text-transform:uppercase;margin:12px 0 44px}
#title .note{font-size:12px;color:var(--dim);letter-spacing:.12em;margin-top:22px;line-height:1.8}
#fade{background:#000;opacity:0;transition:opacity 1.2s;z-index:30;display:grid;place-items:center;text-align:center}
#fadeTxt{font-size:clamp(18px,3vw,26px);letter-spacing:.12em;color:var(--bone);max-width:80vw;line-height:1.7;opacity:0;transition:opacity 1.4s;white-space:pre-line}
#end{background:#000;z-index:45;pointer-events:auto;display:grid;place-items:center;text-align:center;overflow-y:auto}
#end .in{width:min(520px,88vw);padding:20px 0}
#end h2{font-weight:normal;letter-spacing:.4em;font-size:15px;color:var(--rust);text-transform:uppercase}
#end h1{font-weight:normal;font-size:clamp(28px,6vw,48px);letter-spacing:.2em;margin:8px 0 26px}
#end dl{display:grid;grid-template-columns:1fr auto;gap:7px 20px;text-align:left;font-size:15px;color:var(--ash);margin:0 0 26px;border-top:1px solid #2c2822;border-bottom:1px solid #2c2822;padding:14px 4px}
#end dd{margin:0;color:var(--bone);text-align:right}
#err{background:#000;z-index:99;display:grid;place-items:center;text-align:center;padding:30px;font-size:18px;line-height:1.7;color:var(--bone);pointer-events:auto}
/* puntos activos y salidas */
#hs{z-index:5}
.hs{position:absolute;left:-23px;top:-23px;width:46px;height:46px;border-radius:50%;pointer-events:auto;display:none;place-items:center;background:none}
.hs.on{display:grid}
.hs i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(216,200,144,.85);background:rgba(216,200,144,.12);box-shadow:0 0 14px rgba(216,200,144,.35);animation:hsp 2.2s infinite}
.hs i::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:#d8c890;margin:8px auto 0}
.hs:hover i,.hs:active i{background:rgba(216,200,144,.4);border-color:#fff}
.hs.eco i{border-color:rgba(154,176,192,.9);background:rgba(154,176,192,.12);box-shadow:0 0 18px rgba(154,176,192,.5)}.hs.eco i::after{background:#9ab0c0}
@keyframes hsp{0%,100%{transform:scale(.82);opacity:.65}50%{transform:scale(1.12);opacity:1}}
#nav{position:absolute;left:50%;bottom:calc(4% + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(900px,96vw);display:flex;flex-wrap:wrap;justify-content:center;gap:7px;pointer-events:auto;z-index:6}
.nv{font-size:clamp(12px,1.7vw,14px);letter-spacing:.16em;text-transform:uppercase;padding:10px 15px;background:rgba(6,5,4,.78);border:1px solid rgba(143,138,128,.3);border-bottom:2px solid var(--dim);color:var(--bone)}
.nv:hover,.nv:active{border-bottom-color:var(--amber);color:#fff;background:rgba(30,20,12,.9)}
.nv::before{content:"→ ";color:var(--rust)}
.tbar{height:3px;background:#2c2822;margin-bottom:8px;overflow:hidden}.tbar b{display:block;height:100%;background:var(--rust);width:100%;transform-origin:left;animation:tb linear forwards}
@keyframes tb{to{transform:scaleX(0)}}
#touch{display:none!important}
/* táctil */
#touch{z-index:10}
#joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:1px solid rgba(207,198,180,.22);background:rgba(8,7,6,.3);pointer-events:auto}
#joyK{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:rgba(207,198,180,.2);border:1px solid rgba(207,198,180,.45)}
#btnA{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:max(40px,env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:1px solid rgba(184,154,82,.6);background:rgba(20,14,8,.5);pointer-events:auto;display:grid;place-items:center}
#btnA svg{width:34px;height:34px;stroke:var(--amber);fill:none;stroke-width:1.5}
#btnR{position:absolute;right:max(116px,calc(env(safe-area-inset-right) + 90px));bottom:max(28px,env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:1px solid rgba(207,198,180,.3);background:rgba(8,7,6,.4);pointer-events:auto;display:grid;place-items:center}
#btnR svg{width:24px;height:24px;stroke:var(--bone);fill:none;stroke-width:1.5}#btnR.on{border-color:var(--rust);background:rgba(94,26,18,.5)}
body.touch #prompt{bottom:calc(34% + env(safe-area-inset-bottom))}
body.touch #sub,body.touch #choices{bottom:calc(3% + env(safe-area-inset-bottom))}
@media(max-height:480px){.pbody{min-height:150px;padding:10px 14px}.tab{padding:8px 4px 6px}#zona{top:12%}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="layer hidden">
  <div id="estado">
    <svg viewBox="0 0 38 22"><path d="M2 11 Q19 -3 36 11 Q19 25 2 11Z" stroke="#8f8a80" fill="none" stroke-width="1.2"/><circle id="pupila" cx="19" cy="11" r="4.2" fill="#8f8a80"/><path id="parpado" d="M2 11 Q19 -3 36 11 Q19 -3 2 11Z" fill="#0a0908" stroke="#8f8a80" stroke-width="1.2"/></svg>
    <span id="estadoTxt"></span>
  </div>
  <div id="hudBtns">
    <button class="hb" id="hbInv" aria-label="Inventario"><svg viewBox="0 0 20 20"><path d="M4 7h12l-1 11H5zM7 7V5a3 3 0 016 0v2"/></svg></button>
    <button class="hb" id="hbCua" aria-label="Cuaderno"><svg viewBox="0 0 20 20"><path d="M4 3h10a2 2 0 012 2v12H6a2 2 0 01-2-2zM7 7h6M7 10h6M7 13h4"/></svg></button>
    <button class="hb" id="hbPau" aria-label="Pausa"><svg viewBox="0 0 20 20"><path d="M7 4v12M13 4v12"/></svg></button>
  </div>
  <div id="zona"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
</div>

<div id="hs" class="layer"></div>
<div id="nav" class="hidden"></div>
<div id="touch" class="layer hidden">
  <div id="joy"><div id="joyK"></div></div>
  <button id="btnR" aria-label="Correr"><svg viewBox="0 0 24 24"><path d="M5 12h9M11 6l6 6-6 6M19 5v14"/></svg></button>
  <button id="btnA" aria-label="Acción"><svg viewBox="0 0 34 34"><path d="M3 17 Q17 4 31 17 Q17 30 3 17Z"/><circle cx="17" cy="17" r="4.5"/></svg></button>
</div>

<div id="sub" class="hidden"><div id="subWho"></div><div id="subTxt"></div><div id="subNext">▼</div></div>
<div id="choices" class="hidden"></div>

<div id="doc" class="veil hidden"><div class="panel"><div id="docBody"></div><div class="hint" id="docHint"></div></div></div>

<div id="book" class="veil hidden"><div class="panel">
  <button class="close" id="bookClose" aria-label="Cerrar">✕</button>
  <div class="tabs" id="bookTabs"></div>
  <div class="pbody" id="bookBody"></div>
